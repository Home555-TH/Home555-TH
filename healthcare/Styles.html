<style>
:root {
  --primary: #4285f4;
  --primary-dark: #3367d6;
  --secondary: #5f6368;
  --success: #34a853;
  --warning: #fbbc04;
  --danger: #ea4335;
  --info: #4fc3f7;
  --light: #f8f9fa;
  --dark: #202124;
  --border: #dadce0;
  --shadow: 0 2px 8px rgba(0,0,0,0.1);
  --radius: 12px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Sarabun', sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  color: var(--dark);
}

/* Header */
.header {
  background: rgba(255,255,255,0.95);
  padding: 15px 20px;
  box-shadow: var(--shadow);
  position: sticky;
  top: 0;
  z-index: 100;
}

.header-content {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
}

.header h1 {
  color: var(--primary);
  font-size: 1.5rem;
  display: flex;
  align-items: center;
  gap: 10px;
}

.patient-info {
  display: flex;
  align-items: center;
  gap: 15px;
}

.surgery-countdown {
  background: linear-gradient(135deg, #ff6b6b, #ee5a24);
  color: white;
  padding: 5px 15px;
  border-radius: 20px;
  font-size: 0.9rem;
  font-weight: 600;
}

/* Navigation */
.nav-tabs {
  background: rgba(255,255,255,0.9);
  padding: 10px 20px;
  display: flex;
  gap: 5px;
  overflow-x: auto;
  border-bottom: 1px solid var(--border);
}

.nav-tab {
  background: none;
  border: none;
  padding: 10px 15px;
  font-size: 0.9rem;
  font-family: inherit;
  color: var(--secondary);
  cursor: pointer;
  border-radius: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
  transition: all 0.2s;
}

.nav-tab:hover {
  background: var(--light);
  color: var(--primary);
}

.nav-tab.active {
  background: var(--primary);
  color: white;
}

/* Main Content */
.main-content {
  max-width: 1200px;
  margin: 20px auto;
  padding: 0 20px;
}

.tab-content {
  display: none;
}

.tab-content.active {
  display: block;
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Cards */
.dashboard-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 20px;
}

.card {
  background: white;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}

.card-highlight {
  background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
  color: white;
}

.card-header {
  padding: 15px 20px;
  font-weight: 600;
  font-size: 1rem;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--border);
}

.card-highlight .card-header {
  border-bottom-color: rgba(255,255,255,0.2);
}

.card-body {
  padding: 20px;
}

.surgery-date {
  font-size: 1.2rem;
  font-weight: 600;
  margin-bottom: 10px;
}

.countdown-display {
  font-size: 2.5rem;
  font-weight: 700;
}

.phase-indicator {
  margin-top: 10px;
  padding: 5px 15px;
  background: rgba(255,255,255,0.2);
  border-radius: 20px;
  display: inline-block;
}

.big-number {
  font-size: 3rem;
  font-weight: 700;
  color: var(--primary);
}

.no-data {
  color: var(--secondary);
  font-style: italic;
}

.quick-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* Section Header */
.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 15px;
  background: white;
  padding: 20px;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

.section-header h2 {
  font-size: 1.3rem;
  color: var(--dark);
  display: flex;
  align-items: center;
  gap: 10px;
}

.header-buttons {
  display: flex;
  gap: 10px;
}

/* Buttons */
.btn {
  padding: 10px 20px;
  border: none;
  border-radius: 8px;
  font-family: inherit;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: all 0.2s;
}

.btn-primary {
  background: var(--primary);
  color: white;
}

.btn-primary:hover {
  background: var(--primary-dark);
}

.btn-secondary {
  background: var(--secondary);
  color: white;
}

.btn-secondary:hover {
  background: #4a4e51;
}

.btn-success {
  background: var(--success);
  color: white;
}

.btn-success:hover {
  background: #2d9348;
}

.btn-danger {
  background: var(--danger);
  color: white;
}

.btn-sm {
  padding: 5px 10px;
  font-size: 0.8rem;
}

/* Forms */
.form-container {
  background: white;
  border-radius: var(--radius);
  padding: 25px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.form-container.hidden {
  display: none;
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 15px;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.form-group.full-width {
  grid-column: 1 / -1;
}

.form-group label {
  font-weight: 600;
  font-size: 0.9rem;
  color: var(--secondary);
}

.form-group input,
.form-group select,
.form-group textarea {
  padding: 10px 15px;
  border: 2px solid var(--border);
  border-radius: 8px;
  font-family: inherit;
  font-size: 1rem;
  transition: border-color 0.2s;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
  outline: none;
  border-color: var(--primary);
}

.form-actions {
  margin-top: 20px;
  display: flex;
  gap: 10px;
}

/* Tables */
.data-table-container {
  background: white;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
  margin-top: 20px;
}

.data-table {
  width: 100%;
  border-collapse: collapse;
}

.data-table th,
.data-table td {
  padding: 12px 15px;
  text-align: left;
  border-bottom: 1px solid var(--border);
}

.data-table th {
  background: var(--light);
  font-weight: 600;
  color: var(--secondary);
  font-size: 0.85rem;
  text-transform: uppercase;
}

.data-table tr:hover {
  background: var(--light);
}

.data-table tr.highlight-row {
  background: #fff3cd;
}

.data-table tr.surgery-row {
  background: #ffe5e5;
}

/* Status Badges */
.status-badge {
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 0.8rem;
  font-weight: 600;
}

.status-pending {
  background: var(--warning);
  color: var(--dark);
}

.status-confirmed {
  background: var(--info);
  color: white;
}

.status-completed {
  background: var(--success);
  color: white;
}

.status-tobuy {
  background: var(--danger);
  color: white;
}

.status-bought {
  background: var(--success);
  color: white;
}

/* Modal */
.modal {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,0.5);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 1000;
  padding: 20px;
}

.modal.hidden {
  display: none;
}

.modal-content {
  background: white;
  border-radius: var(--radius);
  max-width: 800px;
  width: 100%;
  max-height: 80vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.modal-header {
  padding: 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.modal-header h3 {
  display: flex;
  align-items: center;
  gap: 10px;
}

.modal-close {
  background: none;
  border: none;
  font-size: 1.5rem;
  cursor: pointer;
  color: var(--secondary);
}

.modal-body {
  padding: 20px;
  overflow-y: auto;
}

/* Meal Plans */
.meal-plan-filters {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.filter-btn {
  padding: 8px 16px;
  border: 2px solid var(--border);
  border-radius: 20px;
  background: white;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.2s;
}

.filter-btn.active {
  background: var(--primary);
  border-color: var(--primary);
  color: white;
}

.meal-plans-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 15px;
}

.meal-plan-card {
  background: var(--light);
  border-radius: 10px;
  padding: 15px;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
}

.meal-plan-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow);
}

.meal-plan-card h4 {
  margin-bottom: 5px;
  color: var(--primary);
}

.meal-plan-card .meal-type {
  font-size: 0.8rem;
  color: var(--secondary);
  margin-bottom: 10px;
}

.meal-plan-card .ingredients {
  font-size: 0.85rem;
  color: var(--dark);
  margin-bottom: 10px;
}

.meal-plan-card .nutrition {
  display: flex;
  gap: 15px;
  font-size: 0.8rem;
  color: var(--secondary);
}

/* Grocery Summary */
.grocery-summary {
  background: white;
  border-radius: var(--radius);
  padding: 20px;
  display: flex;
  gap: 30px;
  margin-top: 20px;
  box-shadow: var(--shadow);
}

.summary-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.summary-item .value {
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--primary);
}

/* Condiments Grid */
.condiments-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 10px;
  background: white;
  padding: 20px;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  margin-bottom: 20px;
}

.condiment-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 15px;
  background: var(--light);
  border-radius: 8px;
}

.condiment-item .name {
  font-weight: 500;
}

.condiment-item .status-must {
  color: var(--danger);
  font-weight: 600;
  font-size: 0.8rem;
}

.condiment-item .status-recommend {
  color: var(--warning);
  font-weight: 600;
  font-size: 0.8rem;
}

.sub-header {
  margin: 20px 0 15px;
  font-size: 1.1rem;
  color: white;
  display: flex;
  align-items: center;
  gap: 10px;
}

/* Health Stats */
.health-stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
  gap: 10px;
}

.health-stat {
  text-align: center;
  padding: 10px;
  background: var(--light);
  border-radius: 8px;
}

.health-stat .value {
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--primary);
}

.health-stat .label {
  font-size: 0.8rem;
  color: var(--secondary);
}

/* Toast */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--dark);
  color: white;
  padding: 15px 30px;
  border-radius: 8px;
  box-shadow: var(--shadow);
  z-index: 2000;
  animation: slideUp 0.3s ease;
}

.toast.hidden {
  display: none;
}

.toast.success {
  background: var(--success);
}

.toast.error {
  background: var(--danger);
}

@keyframes slideUp {
  from { transform: translateX(-50%) translateY(20px); opacity: 0; }
  to { transform: translateX(-50%) translateY(0); opacity: 1; }
}

/* Loading */
.loading-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(255,255,255,0.8);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 3000;
}

.loading-overlay.hidden {
  display: none;
}

.loading-spinner {
  width: 50px;
  height: 50px;
  border: 4px solid var(--border);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* Appointment List in Dashboard */
.apt-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.apt-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px;
  background: var(--light);
  border-radius: 8px;
}

.apt-item.surgery {
  background: #ffe5e5;
  border-left: 4px solid var(--danger);
}

.apt-item .date {
  font-weight: 600;
}

.apt-item .detail {
  font-size: 0.9rem;
  color: var(--secondary);
}

/* Responsive */
@media (max-width: 768px) {
  .header-content {
    flex-direction: column;
    text-align: center;
  }

  .nav-tabs {
    justify-content: flex-start;
  }

  .section-header {
    flex-direction: column;
    align-items: flex-start;
  }

  .form-grid {
    grid-template-columns: 1fr;
  }

  .data-table-container {
    overflow-x: auto;
  }

  .data-table {
    min-width: 600px;
  }
}
</style>
